app = 'gem-viz-staging'
primary_region = 'sjc'

[build]
  [build.args]
    PUBLIC_OWNERSHIP_API_BASE_URL = "https://gem-ownership-api-staging.fly.dev"

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
