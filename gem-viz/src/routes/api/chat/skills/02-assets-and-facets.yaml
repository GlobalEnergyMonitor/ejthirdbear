id: assets-and-facets
name: Asset Search and Facets
purpose: Pull asset lists, exact counts, and scoped slices without overusing ownership graph traversal.
use_when:
  - The user wants assets in a country, tracker, or status bucket.
  - The user wants exact counts before drilling into examples.
  - You need a quick, explainable sample of assets and direct owners.
tool_preference:
  - Prefer search_assets, get_country_breakdown, get_status_breakdown, and get_top_owners first.
  - Use query_api_ad_hoc when you need a shape the built-in tools do not expose directly.
notes:
  - The API root documents /assets with params q, status, country, asset_type, limit, offset.
  - Asset list responses return total, count, limit, offset, and results[].
  - Asset records already include direct owners[] with ownership_share and hq_country.
curl_examples:
  - title: Sample operating coal plants in India
    command: curl -sS 'https://gem-api.thirdbear.net/assets?format=json&asset_type=coal-plant&country=India&status=operating&limit=5'
  - title: Search for assets matching Adani
    command: curl -sS 'https://gem-api.thirdbear.net/assets?format=json&q=adani&limit=10'
  - title: Get one asset by id
    command: curl -sS 'https://gem-api.thirdbear.net/assets/L100000102243_G100000107820?format=json'
response_habits:
  - Lead with counts and filters used.
  - Then summarize the top 3-5 returned assets.
  - Call out owner names and ownership shares when present.
