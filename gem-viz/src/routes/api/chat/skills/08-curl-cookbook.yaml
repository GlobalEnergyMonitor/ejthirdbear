id: curl-cookbook
name: Curl Cookbook
purpose: Keep a compact bank of working backend query recipes that can be adapted for unusual user asks.
recipes:
  - title: Endpoint registry
    command: curl -sS https://gem-api.thirdbear.net/
    adapts_for:
      - discovering route names
      - checking whether a capability exists

  - title: Metadata snapshot
    command: curl -sS 'https://gem-api.thirdbear.net/metadata?format=json'
    adapts_for:
      - freshness questions
      - counts of assets, entities, and sources

  - title: Entity search
    command: curl -sS 'https://gem-api.thirdbear.net/entities?format=json&q=BlackRock&limit=5'
    adapts_for:
      - resolving entity ids
      - ambiguous company names

  - title: Direct entity owners
    command: curl -sS 'https://gem-api.thirdbear.net/entities/E100000000650/owners?format=json'
    adapts_for:
      - parent company questions
      - direct ownership lookups

  - title: Asset slice by tracker, country, and status
    command: curl -sS 'https://gem-api.thirdbear.net/assets?format=json&asset_type=coal-plant&country=India&status=operating&limit=5'
    adapts_for:
      - country slices
      - tracker/status counts with examples

  - title: Ownership graph traversal
    command: curl -sS 'https://gem-api.thirdbear.net/ownership/graph?format=json&root=E100000000650&direction=down&max_depth=2'
    adapts_for:
      - what does this company control
      - graph-shaped ownership explanations

  - title: Source catalog
    command: curl -sS 'https://gem-api.thirdbear.net/catalog/sources?format=json'
    adapts_for:
      - provenance
      - source-file debugging
