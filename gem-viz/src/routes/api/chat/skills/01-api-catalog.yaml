id: api-catalog
name: API Catalog Explorer
purpose: Discover what the GEM ownership API can do before reaching for a custom query.
use_when:
  - The user asks what endpoints exist.
  - The built-in Gembot tools do not clearly cover the request.
  - You need metadata, source catalog, field mappings, or other schema-style context.
tool_preference:
  - First call discover_api_endpoints.
  - Then call query_api_ad_hoc with endpoint_key or a relative path.
notes:
  - The API root is a machine-readable registry.
  - Prefer GET-only queries.
  - Keep ad hoc exploration inside these families: /entities, /assets, /ownership, /catalog, /segments, /metadata.
curl_examples:
  - title: List the endpoint registry
    command: curl -sS https://gem-api.thirdbear.net/
  - title: Read deployment metadata
    command: curl -sS 'https://gem-api.thirdbear.net/metadata?format=json'
  - title: List source files loaded into the API
    command: curl -sS 'https://gem-api.thirdbear.net/catalog/sources?format=json'
  - title: Inspect field mappings
    command: curl -sS 'https://gem-api.thirdbear.net/catalog/field-mappings?format=json'
