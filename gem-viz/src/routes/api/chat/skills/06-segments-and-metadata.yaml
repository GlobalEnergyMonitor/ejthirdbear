id: segments-and-metadata
name: Segments and Metadata
purpose: Answer schema, provenance, deployment, and prebuilt-slice questions directly from backend support routes.
use_when:
  - The user asks what data is loaded, how fresh it is, or which source files power the API.
  - The user asks for prebuilt segments or reusable backend slices.
  - You need backend metadata instead of asset/entity content.
tool_preference:
  - Use query_api_ad_hoc for metadata, catalog_sources, catalog_field_mappings, and segments.
notes:
  - Metadata is a good first stop for build timestamp, git commit, asset count, entity count, and source count.
  - Catalog sources lists loaded input files and output row counts.
  - Segments is useful when the backend already defines reusable slices.
curl_examples:
  - title: Read deployment metadata
    command: curl -sS 'https://gem-api.thirdbear.net/metadata?format=json'
  - title: List catalog sources
    command: curl -sS 'https://gem-api.thirdbear.net/catalog/sources?format=json'
  - title: List field mappings
    command: curl -sS 'https://gem-api.thirdbear.net/catalog/field-mappings?format=json'
  - title: List prebuilt segments
    command: curl -sS 'https://gem-api.thirdbear.net/segments?format=json'
response_habits:
  - Include concrete counts and timestamps.
  - Mention source file names when provenance matters.
  - Distinguish between backend metadata and asset-level findings.
