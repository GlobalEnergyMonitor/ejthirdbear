name: Build and Deploy

on:
  push:
    branches: [main, staging]
    paths:
      - 'gem-viz/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gem-viz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io staging
        # Commit message and author can contain shell metacharacters
        # (backticks, $(...), quotes). Pass them via env: so the values are
        # exported as quoted env vars rather than string-interpolated into
        # the run command.
        run: |
          flyctl deploy --config fly.staging.toml --remote-only \
            --build-arg GIT_COMMIT="$GIT_COMMIT" \
            --build-arg GIT_MESSAGE="$GIT_MESSAGE" \
            --build-arg GIT_AUTHOR="$GIT_AUTHOR"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GIT_COMMIT: ${{ github.sha }}
          GIT_MESSAGE: ${{ github.event.head_commit.message }}
          GIT_AUTHOR: ${{ github.event.head_commit.author.name }}

      - name: Verify deploy (cache-bust chain + commit match)
        run: |
          SEMVER=$(node -p "require('./package.json').version")
          EXPECT_SEMVER="$SEMVER" EXPECT_COMMIT="${{ github.sha }}" \
            bash scripts/verify-deploy.sh https://gem-viz-staging.fly.dev

      - name: Deployment summary
        run: |
          echo "## Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Fly staging:** https://gem-viz-staging.fly.dev/" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gem-viz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io production
        # See staging job comment — pass commit metadata via env: so shell
        # metacharacters in the message don't break the run command.
        run: |
          flyctl deploy --config fly.toml --remote-only \
            --build-arg GIT_COMMIT="$GIT_COMMIT" \
            --build-arg GIT_MESSAGE="$GIT_MESSAGE" \
            --build-arg GIT_AUTHOR="$GIT_AUTHOR"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GIT_COMMIT: ${{ github.sha }}
          GIT_MESSAGE: ${{ github.event.head_commit.message }}
          GIT_AUTHOR: ${{ github.event.head_commit.author.name }}

      - name: Verify deploy (cache-bust chain + commit match)
        run: |
          SEMVER=$(node -p "require('./package.json').version")
          EXPECT_SEMVER="$SEMVER" EXPECT_COMMIT="${{ github.sha }}" \
            bash scripts/verify-deploy.sh https://gem-viz.fly.dev

      - name: Deployment summary
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Fly production:** https://gem-viz.fly.dev/" >> $GITHUB_STEP_SUMMARY
